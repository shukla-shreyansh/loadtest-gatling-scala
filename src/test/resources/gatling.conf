gatling {
  core {
    runDescription = "Local Load Test"
    directory {
      binaries = ""  # Leave empty for local testing
      results = "target/gatling"  # Directory for storing test results
    }
    threadPool {
      maxThreads = 10  # Adjust based on machine capacity
    }
  }

  http {
    connectionTimeout = 5000  # Timeout for establishing connections (ms)
    requestTimeout = 10000    # Timeout for requests (ms)
    pooledConnectionIdleTimeout = 60000  # Keep-alive idle timeout (ms)
  }

  performance {
    maxConnectionsPerHost = 5000  # Maximum connections per host
    connectionsReuse = true       # Enable connection reuse
  }
}
